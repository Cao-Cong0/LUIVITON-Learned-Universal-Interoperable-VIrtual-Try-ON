[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luiviton-release"
version = "0.1.0"
description = "Body and clothing correspondence, shared SMPL registration, and clothing transfer"
requires-python = ">=3.10,<3.11"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=1.22.3,<2",
]

[project.scripts]
luiviton = "luiviton.pipeline:main"

[tool.setuptools]
packages = ["luiviton"]
